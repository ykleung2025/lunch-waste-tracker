function schoolDayMap_() {
  var map = {};
  for (var i = 0; i &lt; SCHOOL_DAYS.length; i++) {
    map[SCHOOL_DAYS[i].date] = SCHOOL_DAYS[i].day;
  }
  return map;
}

function cycleDayFor_(dateStr) {
  var map = schoolDayMap_();
  return map[dateStr] || null;
}

function isSchoolDay_(dateStr) {
  return !!cycleDayFor_(dateStr);
}

function validClasses_() {
  var list = [];
  for (var g = 0; g &lt; GRADES.length; g++) {
    for (var s = 0; s &lt; SECTIONS.length; s++) {
      list.push(GRADES[g] + SECTIONS[s]);
    }
  }
  return list;
}

function round2_(n) {
  return Math.round(Number(n) * 100) / 100;
}

function hkToday_() {
  return Utilities.formatDate(new Date(), TZ, &#x27;yyyy-MM-dd&#x27;);
}

function jsonOut_(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getOrCreateSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
  }
  ensureHeaders_(sheet);
  return sheet;
}

function ensureHeaders_(sheet) {
  var lastCol = Math.max(sheet.getLastColumn(), HEADERS.length);
  var range = sheet.getRange(1, 1, 1, HEADERS.length);
  var values = range.getValues()[0];
  var needWrite = false;
  for (var i = 0; i &lt; HEADERS.length; i++) {
    if (String(values[i] || &#x27;&#x27;) !== HEADERS[i]) {
      needWrite = true;
      break;
    }
  }
  if (needWrite &amp;&amp; sheet.getLastRow() === 0) {
    range.setValues([HEADERS]);
    sheet.getRange(1, 1, 1, HEADERS.length).setFontWeight(&#x27;bold&#x27;);
  } else if (needWrite &amp;&amp; String(values[0] || &#x27;&#x27;) === &#x27;&#x27;) {
    range.setValues([HEADERS]);
    sheet.getRange(1, 1, 1, HEADERS.length).setFontWeight(&#x27;bold&#x27;);
  }
}

function readAllRows_(sheet) {
  var lastRow = sheet.getLastRow();
  if (lastRow &lt; 2) return [];
  var data = sheet.getRange(2, 1, lastRow, 4).getValues();
  var rows = [];
  for (var i = 0; i &lt; data.length; i++) {
    var d = data[i];
    if (!d[0] &amp;&amp; !d[1]) continue;
    var dateStr = normalizeDate_(d[0]);
    rows.push({
      date: dateStr,
      class: String(d[1]).trim().toUpperCase(),
      weight_kg: Number(d[2]),
      timestamp: d[3] ? String(d[3]) : &#x27;&#x27;,
    });
  }
  return rows;
}

function normalizeDate_(v) {
  if (Object.prototype.toString.call(v) === &#x27;[object Date]&#x27; &amp;&amp; !isNaN(v.getTime())) {
    return Utilities.formatDate(v, TZ, &#x27;yyyy-MM-dd&#x27;);
  }
  var s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
  return s;
}

/**
 * 本月 1 日至 asOfDate（含）之間的校曆 D1–D6 日期清單。
 */
function schoolDayList_(asOfDate) {
  var ym = String(asOfDate).substring(0, 7);
  var list = [];
  for (var i = 0; i &lt; SCHOOL_DAYS.length; i++) {
    var d = SCHOOL_DAYS[i].date;
    if (d.indexOf(ym) === 0 &amp;&amp; d &lt;= asOfDate) {
      list.push(d);
    }
  }
  return list;
}

/**
 * 本月最常漏登記的班級。
 * missedDays = 本月 D1–D6 上學日中沒有該班紀錄的天數；平手則全部列入 classes。
 */
function computeMostMissed_(rows, asOfDate) {
  var ym = String(asOfDate).substring(0, 7);
  var days = schoolDayList_(asOfDate);
  var totalDays = days.length;
  var classes = validClasses_();

  if (totalDays === 0) {
    return { class: null, classes: [], missedDays: 0, totalDays: 0 };
  }

  var submitted = {};
  for (var i = 0; i &lt; rows.length; i++) {
    var r = rows[i];
    if (String(r.date).indexOf(ym) !== 0) continue;
    if (!submitted[r.class]) submitted[r.class] = {};
    submitted[r.class][r.date] = true;
  }

  var maxMissed = -1;
  var winners = [];
  for (var c = 0; c &lt; classes.length; c++) {
    var cls = classes[c];
    var missed = 0;
    for (var di = 0; di &lt; days.length; di++) {
      if (!submitted[cls] || !submitted[cls][days[di]]) {
        missed++;
      }
    }
    if (missed &gt; maxMissed) {
      maxMissed = missed;
      winners = [cls];
    } else if (missed === maxMissed) {
      winners.push(cls);
    }
  }

  return {
    class: winners.length ? winners[0] : null,
    classes: winners,
    missedDays: maxMissed &lt; 0 ? 0 : maxMissed,
    totalDays: totalDays,
  };
}

function computeHighestAvg_(rows, ym) {
  var classes = validClasses_();
  var bestAvg = null;
  var winners = [];

  for (var c = 0; c &lt; classes.length; c++) {
    var cls = classes[c];
    var weights = [];
    for (var i = 0; i &lt; rows.length; i++) {
      if (rows[i].class === cls &amp;&amp; String(rows[i].date).indexOf(ym) === 0) {
        weights.push(Number(rows[i].weight_kg));
      }
    }
    if (weights.length === 0) continue;
    var sum = 0;
    for (var j = 0; j &lt; weights.length; j++) sum += weights[j];
    var avg = sum / weights.length;
    if (bestAvg === null || avg &gt; bestAvg) {
      bestAvg = avg;
      winners = [cls];
    } else if (avg === bestAvg) {
      winners.push(cls);
    }
  }

  if (winners.length === 0) {
    return { class: null, classes: [], avg: null };
  }
  return {
    class: winners[0],
    classes: winners,
    avg: round2_(bestAvg),
  };
}


/**
 * 上一個日曆月 YYYY-MM（相對目前 ym）。
 */
function prevMonth_(ym) {
  var y = parseInt(String(ym).substring(0, 4), 10);
  var m = parseInt(String(ym).substring(5, 7), 10);
  if (m === 1) {
    y--;
    m = 12;
  } else {
    m--;
  }
  return y + &#x27;-&#x27; + (m &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + m;
}

/**
 * 該月最後一天 YYYY-MM-DD。
 */
function lastDayOfMonth_(ym) {
  var y = parseInt(String(ym).substring(0, 4), 10);
  var m = parseInt(String(ym).substring(5, 7), 10);
  var last = new Date(y, m, 0); // JS：月份 0-based，day 0 = 上月最後一天
  var day = last.getDate();
  return String(ym) + &#x27;-&#x27; + (day &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + day;
}

/**
 * 今日尚未登記的班級（僅 D1–D6 日有意義）。
 * 回傳 { isSchoolDay, cycleDay, missing, submitted }
 */
function computeTodayMissing_(rows, today) {
  var cycleDay = cycleDayFor_(today);
  var classes = validClasses_();
  if (!cycleDay) {
    return { isSchoolDay: false, cycleDay: null, missing: [], submitted: [] };
  }
  var submittedMap = {};
  for (var i = 0; i &lt; rows.length; i++) {
    if (rows[i].date === today) {
      submittedMap[rows[i].class] = true;
    }
  }
  var missing = [];
  var submitted = [];
  for (var c = 0; c &lt; classes.length; c++) {
    var cls = classes[c];
    if (submittedMap[cls]) {
      submitted.push(cls);
    } else {
      missing.push(cls);
    }
  }
  return {
    isSchoolDay: true,
    cycleDay: cycleDay,
    missing: missing,
    submitted: submitted,
  };
}

/**
 * 近兩個月（上月＋本月）各班平均剩食。
 * 回傳 { months: [prev, current], byClass: { P3A: [null|num, null|num], ... } }
 */
function computeTwoMonthAvgs_(rows, currentYm) {
  var prevYm = prevMonth_(currentYm);
  var months = [prevYm, currentYm];
  var classes = validClasses_();
  var byClass = {};
  for (var c = 0; c &lt; classes.length; c++) {
    var cls = classes[c];
    var avgs = [];
    for (var mi = 0; mi &lt; months.length; mi++) {
      var ym = months[mi];
      var weights = [];
      for (var i = 0; i &lt; rows.length; i++) {
        if (rows[i].class === cls &amp;&amp; String(rows[i].date).indexOf(ym) === 0) {
          weights.push(Number(rows[i].weight_kg));
        }
      }
      if (weights.length === 0) {
        avgs.push(null);
      } else {
        var sum = 0;
        for (var j = 0; j &lt; weights.length; j++) sum += weights[j];
        avgs.push(round2_(sum / weights.length));
      }
    }
    byClass[cls] = avgs;
  }
  return { months: months, byClass: byClass };
}

/**
 * 彙總 stats 共用欄位（本月＋上月＋今日漏登＋兩月平均）。
 */
function buildStatsPayload_(rows, dateStr) {
  var ym = String(dateStr).substring(0, 7);
  var lastYm = prevMonth_(ym);
  var lastAsOf = lastDayOfMonth_(lastYm);
  return {
    gradeMins: computeGradeMins_(rows, ym),
    lastMonthGradeMins: computeGradeMins_(rows, lastYm),
    mostMissed: computeMostMissed_(rows, dateStr),
    highestAvg: computeHighestAvg_(rows, ym),
    month: ym,
    cycleDay: cycleDayFor_(dateStr),
    todayMissing: computeTodayMissing_(rows, dateStr),
    lastMonth: lastYm,
    lastMonthMostMissed: computeMostMissed_(rows, lastAsOf),
    lastMonthHighestAvg: computeHighestAvg_(rows, lastYm),
    twoMonthAvgs: computeTwoMonthAvgs_(rows, ym),
  };
}

function computeGradeMins_(rows, ym) {
  var gradeMins = {};
  for (var g = 0; g &lt; GRADES.length; g++) {
    var grade = GRADES[g];
    var bestTotal = null;
    var bestAvg = null;
    for (var s = 0; s &lt; SECTIONS.length; s++) {
      var cls = grade + SECTIONS[s];
      var clsRows = [];
      for (var i = 0; i &lt; rows.length; i++) {
        if (rows[i].class === cls &amp;&amp; String(rows[i].date).indexOf(ym) === 0) {
          clsRows.push(rows[i]);
        }
      }
      if (clsRows.length === 0) continue;
      var total = 0;
      for (var j = 0; j &lt; clsRows.length; j++) {
        total += Number(clsRows[j].weight_kg);
      }
      var avg = total / clsRows.length;
      if (!bestTotal || total &lt; bestTotal.total) {
        bestTotal = { class: cls, total: round2_(total), count: clsRows.length };
      }
      if (!bestAvg || avg &lt; bestAvg.avg) {
        bestAvg = { class: cls, avg: round2_(avg), count: clsRows.length };
      }
    }
    gradeMins[grade] = { lowestTotal: bestTotal, lowestAvg: bestAvg };
  }
  return gradeMins;
}

function classMonthAvg_(rows, className, ym) {
  var weights = [];
  for (var i = 0; i &lt; rows.length; i++) {
    if (rows[i].class === className &amp;&amp; String(rows[i].date).indexOf(ym) === 0) {
      weights.push(Number(rows[i].weight_kg));
    }
  }
  if (weights.length === 0) {
    return { avg: null, count: 0 };
  }
  var sum = 0;
  for (var j = 0; j &lt; weights.length; j++) sum += weights[j];
  return { avg: round2_(sum / weights.length), count: weights.length };
}

var PRAISE = [
  &#x27;太棒了！今天的剩食比平常少，你們真的很惜食！🌟&#x27;,
  &#x27;做得好！少剩一點，地球多一點笑容！💚&#x27;,
  &#x27;讚讚讚！班上同學一起努力，剩食越來越少！👏&#x27;,
  &#x27;超棒！今天的表現值得給自己一個大大的拇指！👍&#x27;,
];
var ENCOURAGE = [
  &#x27;沒關係，明天再一起努力少剩一點！我們可以的！💪&#x27;,
  &#x27;今天雖然多了一點，但下次記得只拿自己吃得完的分量喔！🌱&#x27;,
  &#x27;加油！每一天少剩一點，就是對地球最大的幫忙！🌍&#x27;,
  &#x27;別灰心！惜食是一場馬拉松，明天繼續挑戰吧！🌈&#x27;,
];

function pick_(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/** 今日已登記班級快取。避免登記頁每次都重讀整張試算表。 */
var TODAY_CACHE_TTL_SEC = 21600;
var TODAY_CACHE_PREFIX = &#x27;today_classes_v1_&#x27;;

function todayCacheKey_(dateStr) {
  return TODAY_CACHE_PREFIX + dateStr;
}

function readCachedTodayClasses_(dateStr) {
  try {
    var raw = CacheService.getScriptCache().get(todayCacheKey_(dateStr));
    if (raw == null || raw === &#x27;&#x27;) return null;
    var parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.classes)) return null;
    return parsed.classes;
  } catch (err) {
    return null;
  }
}

function writeCachedTodayClasses_(dateStr, classes) {
  try {
    CacheService.getScriptCache().put(
      todayCacheKey_(dateStr),
      JSON.stringify({ classes: classes }),
      TODAY_CACHE_TTL_SEC
    );
  } catch (err) {
    // 快取失敗時改走試算表，不影響寫入。
  }
}

/**
 * 只讀 date、class 兩欄，篩出當日已登記班級（不讀重量、不計算月統計）。
 */
function readTodayClassesFromSheet_(sheet, dateStr) {
  var lastRow = sheet.getLastRow();
  if (lastRow &lt; 2) return [];
  var data = sheet.getRange(2, 1, lastRow - 1, 2).getValues();
  var found = [];
  var seen = {};
  for (var i = 0; i &lt; data.length; i++) {
    if (normalizeDate_(data[i][0]) !== dateStr) continue;
    var cls = String(data[i][1] || &#x27;&#x27;).trim().toUpperCase();
    if (!cls || seen[cls]) continue;
    seen[cls] = true;
    found.push(cls);
  }
  return found;
}

/**
 * 送出時一次掃過 date/class/weight：確認當日重複，並只累計該班本月重量。
 * 不計算年級榜、上月或圖表。
 */
function scanSubmitContext_(sheet, dateStr, className, ym) {
  var lastRow = sheet.getLastRow();
  var todayClasses = [];
  var seen = {};
  var weights = [];
  var duplicate = false;
  if (lastRow &lt; 2) {
    return { todayClasses: todayClasses, duplicate: false, weights: weights };
  }
  var data = sheet.getRange(2, 1, lastRow - 1, 3).getValues();
  for (var i = 0; i &lt; data.length; i++) {
    var d = normalizeDate_(data[i][0]);
    var cls = String(data[i][1] || &#x27;&#x27;).trim().toUpperCase();
    if (!d || !cls) continue;
    if (d === dateStr) {
      if (!seen[cls]) {
        seen[cls] = true;
        todayClasses.push(cls);
      }
      if (cls === className) duplicate = true;
    }
    if (cls === className &amp;&amp; String(d).indexOf(ym) === 0) {
      var w = Number(data[i][2]);
      if (isFinite(w)) weights.push(w);
    }
  }
  return { todayClasses: todayClasses, duplicate: duplicate, weights: weights };
}

function todayPayloadFromClasses_(dateStr, submittedClasses) {
  var cycleDay = cycleDayFor_(dateStr);
  var classes = validClasses_();
  if (!cycleDay) {
    return {
      ok: true,
      date: dateStr,
      cycleDay: null,
      todayMissing: { isSchoolDay: false, cycleDay: null, missing: [], submitted: [] },
    };
  }
  var submittedMap = {};
  var i;
  for (i = 0; i &lt; submittedClasses.length; i++) {
    submittedMap[submittedClasses[i]] = true;
  }
  var missing = [];
  var submitted = [];
  for (i = 0; i &lt; classes.length; i++) {
    if (submittedMap[classes[i]]) submitted.push(classes[i]);
    else missing.push(classes[i]);
  }
  return {
    ok: true,
    date: dateStr,
    cycleDay: cycleDay,
    todayMissing: {
      isSchoolDay: true,
      cycleDay: cycleDay,
      missing: missing,
      submitted: submitted,
    },
  };
}

function wantsFresh_(body) {
  if (!body || body.fresh === undefined || body.fresh === null || body.fresh === &#x27;&#x27;) return false;
  if (body.fresh === true || body.fresh === 1) return true;
  var flag = String(body.fresh).toLowerCase();
  return flag === &#x27;1&#x27; || flag === &#x27;true&#x27; || flag === &#x27;yes&#x27;;
}

/**
 * 登記頁輕量讀取：只回今日已登記／尚未登記。
 * 非循環日不讀試算表。循環日優先用快取；fresh=true 時重讀 date+class 欄。
 */
function handleToday_(body) {
  var dateStr = String((body &amp;&amp; body.date) || &#x27;&#x27;).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    dateStr = hkToday_();
  }
  if (!cycleDayFor_(dateStr)) {
    return jsonOut_(todayPayloadFromClasses_(dateStr, []));
  }
  if (!wantsFresh_(body)) {
    var cached = readCachedTodayClasses_(dateStr);
    if (cached) return jsonOut_(todayPayloadFromClasses_(dateStr, cached));
  }
  return withScriptLock_(function () {
    if (!wantsFresh_(body)) {
      var again = readCachedTodayClasses_(dateStr);
      if (again) return jsonOut_(todayPayloadFromClasses_(dateStr, again));
    }
    var sheet = getOrCreateSheet_();
    var classes = readTodayClassesFromSheet_(sheet, dateStr);
    writeCachedTodayClasses_(dateStr, classes);
    return jsonOut_(todayPayloadFromClasses_(dateStr, classes));
  });
}

function duplicatePayload_(dateStr, classList, cycleDay) {
  var info = todayPayloadFromClasses_(dateStr, classList || []);
  return {
    ok: false,
    error: &#x27;duplicate&#x27;,
    message: &#x27;這個班級今天已經登記過了喔！每天只能登記一次，明天再來吧！😊&#x27;,
    cycleDay: cycleDay,
    todayMissing: info.todayMissing,
  };
}

function withScriptLock_(fn) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(15000)) {
    return jsonOut_({
      ok: false,
      error: &#x27;busy&#x27;,
      message: &#x27;系統忙碌中，請稍後再試一次。&#x27;,
    });
  }
  try {
    return fn();
  } finally {
    lock.releaseLock();
  }
}

function handleSubmit_(body) {
  var classes = validClasses_();
  var className = String(body[&#x27;class&#x27;] || &#x27;&#x27;).trim().toUpperCase();
  var weight = Number(body.weight_kg);
  var dateStr = String(body.date || &#x27;&#x27;).trim();

  if (classes.indexOf(className) === -1) {
    return jsonOut_({
      ok: false,
      error: &#x27;invalid_class&#x27;,
      message: &#x27;請選擇有效的班級（3A–6D）。&#x27;,
    });
  }
  if (!isFinite(weight) || weight &lt;= 0) {
    return jsonOut_({
      ok: false,
      error: &#x27;invalid_weight&#x27;,
      message: &#x27;請輸入大於 0 的剩食重量（公斤）。&#x27;,
    });
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    dateStr = hkToday_();
  }

  var cycleDay = cycleDayFor_(dateStr);
  if (!cycleDay) {
    return jsonOut_({
      ok: false,
      error: &#x27;not_school_day&#x27;,
      message: &#x27;今天不是校曆上的循環日（D1–D6），不用登記午餐剩食喔！請在有 D 日的上學日再來登記。📅&#x27;,
      cycleDay: null,
    });
  }

  return withScriptLock_(function () {
    var cached = readCachedTodayClasses_(dateStr);
    if (cached &amp;&amp; cached.indexOf(className) !== -1) {
      return jsonOut_(duplicatePayload_(dateStr, cached, cycleDay));
    }

    var sheet = getOrCreateSheet_();
    var ym = dateStr.substring(0, 7);
    var scan = scanSubmitContext_(sheet, dateStr, className, ym);
    if (scan.duplicate) {
      writeCachedTodayClasses_(dateStr, scan.todayClasses);
      return jsonOut_(duplicatePayload_(dateStr, scan.todayClasses, cycleDay));
    }

    var ts = Utilities.formatDate(new Date(), TZ, &quot;yyyy-MM-dd&#x27;T&#x27;HH:mm:ss&quot;);
    sheet.appendRow([dateStr, className, weight, ts]);

    var todayClasses = scan.todayClasses.slice();
    todayClasses.push(className);
    writeCachedTodayClasses_(dateStr, todayClasses);

    var weights = scan.weights.slice();
    weights.push(weight);
    var sum = 0;
    for (var j = 0; j &lt; weights.length; j++) sum += weights[j];
    var monthlyAvg = round2_(sum / weights.length);
    var above = weight &gt; monthlyAvg;
    var comparison = above ? &#x27;above&#x27; : (weight &lt; monthlyAvg ? &#x27;below&#x27; : &#x27;equal&#x27;);
    var message = above ? pick_(ENCOURAGE) : pick_(PRAISE);
    var todayInfo = todayPayloadFromClasses_(dateStr, todayClasses);

    return jsonOut_({
      ok: true,
      todayWeight: round2_(weight),
      monthlyAvg: monthlyAvg,
      sampleCount: weights.length,
      comparison: comparison,
      message: message,
      month: ym,
      cycleDay: cycleDay,
      todayMissing: todayInfo.todayMissing,
    });
  });
}

function handleStats_(body) {
  var dateStr = String((body &amp;&amp; body.date) || &#x27;&#x27;).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    dateStr = hkToday_();
  }
  var sheet = getOrCreateSheet_();
  var rows = readAllRows_(sheet);
  var stats = buildStatsPayload_(rows, dateStr);
  return jsonOut_({
    ok: true,
    gradeMins: stats.gradeMins,
    lastMonthGradeMins: stats.lastMonthGradeMins,
    mostMissed: stats.mostMissed,
    highestAvg: stats.highestAvg,
    month: stats.month,
    cycleDay: stats.cycleDay,
    todayMissing: stats.todayMissing,
    lastMonth: stats.lastMonth,
    lastMonthMostMissed: stats.lastMonthMostMissed,
    lastMonthHighestAvg: stats.lastMonthHighestAvg,
    twoMonthAvgs: stats.twoMonthAvgs,
  });
}

function parseBody_(e) {
  if (!e || !e.postData || !e.postData.contents) return {};
  try {
    return JSON.parse(e.postData.contents);
  } catch (err) {
    return {};
  }
}

function doPost(e) {
  try {
    var body = parseBody_(e);
    var action = String(body.action || &#x27;submit&#x27;).toLowerCase();
    if (action === &#x27;today&#x27;) {
      return handleToday_(body);
    }
    if (action === &#x27;stats&#x27;) {
      return handleStats_(body);
    }
    if (action === &#x27;submit&#x27;) {
      return handleSubmit_(body);
    }
    return jsonOut_({ ok: false, error: &#x27;unknown_action&#x27;, message: &#x27;未知的操作&#x27; });
  } catch (err) {
    return jsonOut_({
      ok: false,
      error: &#x27;server&#x27;,
      message: &#x27;伺服器錯誤：&#x27; + err.message,
    });
  }
}

function doGet(e) {
  try {
    var p = (e &amp;&amp; e.parameter) || {};
    var action = String(p.action || &#x27;stats&#x27;).toLowerCase();
    if (action === &#x27;today&#x27;) {
      return handleToday_({ date: p.date || &#x27;&#x27;, fresh: p.fresh || &#x27;&#x27; });
    }
    if (action === &#x27;stats&#x27;) {
      return handleStats_({ date: p.date || &#x27;&#x27; });
    }
    return jsonOut_({
      ok: true,
      message: &#x27;午餐剩食追蹤 API 運作中。請用 POST 送出 action=today、action=submit 或 action=stats。&#x27;,
    });
  } catch (err) {
    return jsonOut_({
      ok: false,
      error: &#x27;server&#x27;,
      message: &#x27;伺服器錯誤：&#x27; + err.message,
    });
  }
}
