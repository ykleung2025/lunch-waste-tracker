<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="校園午餐剩食追蹤 — 登記今日剩食" />
  <meta name="robots" content="noindex, nofollow" />
  <title>午餐剩食追蹤｜登記</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="record">
  <div class="wrap">
    <header class="site-header">
      <h1>🥗 午餐剩食追蹤</h1>
      <p class="subtitle">登記今日剩食，一起惜食！</p>
      <div class="badge-row">
        <span class="badge">📅 <span id="header-date">—</span></span>
        <span class="badge" id="cycle-day-badge" hidden>—</span>
        <span class="badge">🏫 3A–6D</span>
      </div>
      <nav class="page-nav" aria-label="頁面">
        <a class="page-nav-link is-current" href="index.html" aria-current="page">✏️ 登記</a>
        <a class="page-nav-link" href="stats.html">📊 統計</a>
      </nav>
    </header>

    <div id="mock-banner" class="mock-banner" role="status">
      🧪 目前為<strong>示範模式</strong>（資料存在本機瀏覽器）。正式使用請在 config.js 關閉 USE_MOCK 並填入 Apps Script 網址。
    </div>

    <main>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title"><span class="emoji">✏️</span> 登記今日剩食</h2>
        <form id="waste-form" class="form-grid" novalidate>
          <div>
            <label for="class-select">班級 <span class="hint">（必選，3A–6D；已登記的班會從清單消失）</span></label>
            <select id="class-select" name="class" required>
              <option value="">載入今日名單…</option>
            </select>
          </div>

          <div>
            <label>今日日期 <span class="hint">（自動，香港時間；僅 D1–D6 可登記）</span></label>
            <div class="date-display" id="today-display" aria-live="polite">
              <span>📆</span>
              <span id="today-date">—</span>
            </div>
          </div>

          <div>
            <label for="weight-input">
              今日剩食重量（公斤 kg）
              <span class="hint">（大於 0）</span>
            </label>
            <input
              id="weight-input"
              name="weight"
              type="number"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              placeholder="例如：1.25"
              required
            />
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
              送出登記
            </button>
          </div>
        </form>

        <div id="feedback" class="feedback" role="status" aria-live="polite">
          <p class="title" id="feedback-title"></p>
          <p class="msg" id="feedback-msg"></p>
          <div class="stats-line" id="feedback-stats" hidden></div>
        </div>
      </section>

      <section class="card" aria-labelledby="today-status-title">
        <h2 id="today-status-title"><span class="emoji">🔔</span> 今日登記狀況</h2>
        <p class="hint" style="margin: -0.5rem 0 1rem">
          只看今天：哪些班已登記、哪些班尚未登記。已登記的班不會出現在上方班級選單。
        </p>
        <p id="today-missing-status" class="today-missing-status">載入中…</p>
        <p class="today-group-label" id="today-missing-label" hidden>尚未登記</p>
        <div id="today-missing-list" class="today-missing-list" hidden></div>
        <p class="today-group-label" id="today-submitted-label" hidden>已登記</p>
        <p id="today-submitted-status" class="today-submitted-status" hidden></p>
        <div id="today-submitted-list" class="today-missing-list" hidden></div>
        <div class="actions" style="margin-top: 0.9rem">
          <button type="button" class="btn btn-secondary" id="refresh-today-btn">
            🔄 重新整理今日名單
          </button>
        </div>
      </section>
    </main>

    <p class="footer-note">
      無廣告 · 無追蹤 · 月統計與排行在 <a href="stats.html">統計頁</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
